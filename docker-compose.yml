# Local full stack: SQL Server 2022 + ASP.NET Core API + React (nginx).
#   cp .env.example .env   # then edit secrets
#   docker compose up --build
# App: http://localhost:8080   API/Swagger: http://localhost:5080/swagger
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?set SQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: SqlServer
      ConnectionStrings__Default: "Server=db,1433;Database=AuraOps;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      Cors__AllowedOrigins__0: http://localhost:8080
      Seed__AdminEmail: ${ADMIN_EMAIL:-admin@auraops.local}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      Seed__DemoData: ${SEED_DEMO_DATA:-true}
      Seed__DemoPassword: ${DEMO_PASSWORD:-Demo123!}
      Swagger__Enabled: "true"
      Https__Redirect: "false"
    ports:
      - "5080:8080"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  sqldata:
